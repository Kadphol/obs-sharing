name: Deploy to GitHub Pages

# ponytail: Pages serves the gh-pages branch (auto-enabled on first push);
# this just mirrors main -> gh-pages. Switch to actions/deploy-pages if the
# site ever needs a build step.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin HEAD:gh-pages --force
